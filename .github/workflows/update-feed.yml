name: Update RSS Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Packages installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: RSS-feed genereren
        run: python generate_feed.py

      - name: Controleren of feed bestaat
        run: |
          test -f feed.xml
          echo "feed.xml bestaat"
          head -n 10 feed.xml

      - name: Feed opslaan in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in RSS-feed"
          else
            git commit -m "Automatische update RSS feed"
            git push
          fi
